<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Totem Builder Raw JSON</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --font-display: "Space Grotesk", "Open Sans", system-ui, sans-serif;
      --font-body: "Inter", "PT Sans", system-ui, sans-serif;
      --color-bg: #f5f7fb;
      --color-surface: #ffffff;
      --color-surface-hover: #f5f7ff;
      --color-primary: #2d5bff;
      --color-primary-strong: #1f44d1;
      --color-text: #0f172a;
      --color-muted: #475569;
      --color-border: #e5e7eb;
      --shadow-sm: 0 6px 24px rgba(15, 23, 42, 0.08);
      --radius-lg: 18px;
      --radius-md: 10px;
      --radius-pill: 999px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: var(--font-body);
      background: var(--color-bg);
      color: var(--color-text);
      padding: 32px 18px;
    }

    main {
      max-width: 980px;
      margin: 0 auto;
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-sm);
      padding: 24px;
    }

    h1 {
      font-family: var(--font-display);
      font-size: 28px;
      margin: 0 0 8px;
    }

    p {
      margin: 0 0 16px;
      color: var(--color-muted);
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 16px;
    }

    button {
      border: 1px solid var(--color-border);
      border-radius: var(--radius-pill);
      background: var(--color-surface);
      color: var(--color-text);
      cursor: pointer;
      font-weight: 600;
      padding: 9px 16px;
    }

    button.primary {
      background: linear-gradient(135deg, var(--color-primary), var(--color-primary-strong));
      color: #fff;
      border-color: transparent;
    }

    .status {
      background: var(--color-surface-hover);
      border-radius: var(--radius-md);
      padding: 10px 12px;
      margin-bottom: 16px;
      color: var(--color-muted);
    }

    textarea {
      width: 100%;
      min-height: 520px;
      border: 1px solid var(--color-border);
      border-radius: var(--radius-md);
      padding: 12px 13px;
      font-family: Menlo, Consolas, monospace;
      font-size: 13px;
      white-space: pre;
    }

    @media (max-width: 640px) {
      body {
        padding: 18px 12px;
      }

      textarea {
        min-height: 420px;
      }
    }
  </style>
</head>
<body>
  <main>
    <h1>Raw JSON</h1>
    <p>Snapshot from Totem Builder or data/events.json.</p>
    <div class="toolbar">
      <button type="button" id="reload">Reload from disk</button>
      <button type="button" id="copy">Copy</button>
      <button type="button" class="primary" id="download">Download</button>
    </div>
    <div class="status" id="status">Loading...</div>
    <textarea id="raw-json" readonly></textarea>
  </main>

  <script>
    (function () {
      var output = document.getElementById('raw-json');
      var status = document.getElementById('status');

      function stringifyJson(payload) {
        return JSON.stringify(payload, null, 2).replace(/[\u007f-\uffff]/g, function (char) {
          return '\\u' + char.charCodeAt(0).toString(16).padStart(4, '0');
        }) + '\n';
      }

      function setStatus(message) {
        status.textContent = message;
      }

      function loadFromStorage() {
        try {
          var text = localStorage.getItem('totemRawJson');
          var updatedAt = localStorage.getItem('totemRawUpdatedAt');
          if (text) {
            output.value = text;
            setStatus(updatedAt ? 'Loaded snapshot from Totem Builder at ' + updatedAt + '.' : 'Loaded snapshot from Totem Builder.');
            return true;
          }
        } catch (err) {
          return false;
        }
        return false;
      }

      function loadFromDisk() {
        setStatus('Loading data/events.json...');
        fetch('data/events.json', { cache: 'no-store' })
          .then(function (response) {
            if (!response.ok) throw new Error('Could not load data/events.json.');
            return response.json();
          })
          .then(function (payload) {
            output.value = stringifyJson(payload);
            setStatus('Loaded data/events.json from disk.');
          })
          .catch(function (err) {
            output.value = '';
            setStatus(err.message);
          });
      }

      document.getElementById('reload').addEventListener('click', loadFromDisk);
      document.getElementById('copy').addEventListener('click', function () {
        if (!navigator.clipboard) {
          output.select();
          document.execCommand('copy');
          setStatus('Copied JSON from the text area.');
          return;
        }
        navigator.clipboard.writeText(output.value)
          .then(function () { setStatus('Copied JSON to clipboard.'); })
          .catch(function (err) { setStatus('Copy failed: ' + err.message); });
      });
      document.getElementById('download').addEventListener('click', function () {
        var blob = new Blob([output.value], { type: 'application/json' });
        var url = URL.createObjectURL(blob);
        var link = document.createElement('a');
        link.href = url;
        link.download = 'events.json';
        document.body.appendChild(link);
        link.click();
        link.remove();
        URL.revokeObjectURL(url);
        setStatus('Downloaded events.json.');
      });

      if (!loadFromStorage()) {
        loadFromDisk();
      }
    })();
  </script>
</body>
</html>
